apiVersion: v1
kind: Namespace
metadata:
  name: cfp
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: cfp
data:
  PORT: "4000"
  FRONTEND_URL: "http://localhost:8080"
  AWS_REGION: "us-east-1"
  AWS_ENDPOINT_URL: "http://localstack:4566"
  S3_PUBLIC_ENDPOINT: "http://localhost:4566"
  S3_BUCKET: "cfp-files"
  SQS_QUEUE_URL: "http://localstack:4566/000000000000/cfp-chunks"
  CHUNK_SIZE_BYTES: "50000"
  MAX_ATTEMPTS: "3"
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: cfp
type: Opaque
stringData:
  DATABASE_URL: "postgresql://cfp_user:cfp_pass@postgres:5432/cfp_db"
  JWT_SECRET: "change-me-to-a-long-random-string"
  AWS_ACCESS_KEY_ID: "test"
  AWS_SECRET_ACCESS_KEY: "test"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: localstack-init
  namespace: cfp
data:
  init.sh: |
    #!/bin/bash
    awslocal s3 mb s3://cfp-files
    awslocal s3api put-bucket-cors --bucket cfp-files --cors-configuration '{
      "CORSRules": [{
        "AllowedOrigins": ["http://localhost:8080"],
        "AllowedMethods": ["GET","PUT","POST","HEAD"],
        "AllowedHeaders": ["*"],
        "ExposeHeaders": ["ETag"]
      }]
    }'
    awslocal sqs create-queue --queue-name cfp-chunks-dlq
    awslocal sqs create-queue --queue-name cfp-chunks \
      --attributes '{"RedrivePolicy":"{\"deadLetterTargetArn\":\"arn:aws:sqs:us-east-1:000000000000:cfp-chunks-dlq\",\"maxReceiveCount\":\"5\"}"}'