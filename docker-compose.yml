services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cfp_user
      POSTGRES_PASSWORD: cfp_pass
      POSTGRES_DB: cfp_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cfp_user -d cfp_db"]
      interval: 3s
      timeout: 3s
      retries: 10

  localstack:
    image: localstack/localstack:3.8.1
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3,sqs
    volumes:
      - localstackdata:/var/lib/localstack
      - ./docker/localstack/init.sh:/etc/localstack/init/ready.d/init.sh

  migrate:
    build: ./backend
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://cfp_user:cfp_pass@postgres:5432/cfp_db
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ./backend
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://cfp_user:cfp_pass@postgres:5432/cfp_db
      JWT_SECRET: change-me-to-a-long-random-string
      FRONTEND_URL: http://localhost:8080
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
      S3_PUBLIC_ENDPOINT: http://localhost:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      S3_BUCKET: cfp-files
      SQS_QUEUE_URL: http://localstack:4566/000000000000/cfp-chunks
      CHUNK_SIZE_BYTES: 50000
    depends_on:
      migrate:
        condition: service_completed_successfully
      localstack:
        condition: service_started

  worker:
    build: ./worker
    environment:
      DATABASE_URL: postgresql://cfp_user:cfp_pass@postgres:5432/cfp_db
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      S3_BUCKET: cfp-files
      SQS_QUEUE_URL: http://localstack:4566/000000000000/cfp-chunks
      MAX_ATTEMPTS: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
      localstack:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:4000
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
  localstackdata: